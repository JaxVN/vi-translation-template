name: Release assets

# Khi publish một GitHub Release: build DOCX/HTML/EPUB và đính kèm vào release.
# Zenodo (nếu đã bật tích hợp cho repo) tự lưu snapshot và cấp DOI phiên bản.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra
        run: python3 scripts/check.py
      - name: Cài pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build
        run: bash scripts/build.sh
      - name: Đính kèm vào release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.docx build/*.html build/*.epub --clobber
